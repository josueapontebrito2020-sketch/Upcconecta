name: upcconect
description: "UpcConecta: servicios, grupos y viajes de la comunidad de la Universidad Popular del Cesar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Backend: autenticación, base de datos, archivos y tiempo real.
  supabase_flutter: ^2.18.3
  # Estado de la app e inyección de dependencias.
  flutter_riverpod: ^3.4.0
  # Navegación entre pantallas.
  go_router: ^18.1.0
  # Elegir fotos y videos (galería o cámara).
  image_picker: ^1.2.0
  # Reproducir los videos de las publicaciones.
  video_player: ^2.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Genera lib/l10n/app_localizations.dart a partir de lib/l10n/app_es.arb.
  generate: true

  assets:
    - assets/images/
    - assets/fonts/OFL.txt

  # Libre Franklin: versión libre (licencia OFL) de Franklin Gothic,
  # la tipografía del manual de identidad de la universidad.
  fonts:
    - family: LibreFranklin
      fonts:
        - asset: assets/fonts/LibreFranklin-Regular.ttf
          weight: 400
        - asset: assets/fonts/LibreFranklin-Medium.ttf
          weight: 500
        - asset: assets/fonts/LibreFranklin-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LibreFranklin-Bold.ttf
          weight: 700
        - asset: assets/fonts/LibreFranklin-ExtraBold.ttf
          weight: 800
